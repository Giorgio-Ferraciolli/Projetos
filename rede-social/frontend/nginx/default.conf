# nginx do frontend:
# - serve o build do React (SPA);
# - repassa /api e /media para o backend. Assim navegador, API e cookies ficam na mesma
#   origem (sem CORS) e o backend não precisa ser exposto diretamente em produção.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Limite de upload (a API também valida: 5 MB por imagem).
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mesmo id de requisição nos logs do nginx e da API.
        proxy_set_header X-Request-ID $request_id;
    }

    location /media/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        # Os nomes dos arquivos são aleatórios e nunca mudam: cache longo é seguro.
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Arquivos gerados pelo Vite têm hash no nome: podem ficar em cache "para sempre".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Qualquer outra rota é da SPA: devolve o index.html e o React Router decide a página.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
